  <script>
  /* Der Bundler ersetzt beim Entpacken das komplette Dokument. Dieser Wachhund
     setzt Titel, Manifest und Icon danach wieder ein, damit "Zum Startbildschirm
     hinzufuegen" das eigene Symbol bekommt. */
  (function () {
    var TITLE = 'In liebevoller Erinnerung an Klaus Hochstrate';
    var LINKS = [
      { rel: 'manifest', href: 'manifest.json' },
      { rel: 'icon', href: 'icon-192.png' },
      { rel: 'apple-touch-icon', href: 'icon-192.png' }
    ];
    var queued = false;
    function ensure() {
      queued = false;
      var head = document.head;
      if (!head) return;
      if (document.title !== TITLE) { try { document.title = TITLE; } catch (e) {} }
      for (var i = 0; i < LINKS.length; i++) {
        var l = LINKS[i];
        if (head.querySelector('link[rel="' + l.rel + '"]')) continue;
        var el = document.createElement('link');
        el.rel = l.rel; el.href = l.href;
        head.appendChild(el);
      }
    }
    function schedule() { if (!queued) { queued = true; setTimeout(ensure, 100); } }
    ensure();
    try { new MutationObserver(schedule).observe(document, { childList: true, subtree: true }); } catch (e) {}
    document.addEventListener('DOMContentLoaded', ensure);
    window.addEventListener('load', ensure);
  })();

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n<\u002Fstyle>\n<style>\n  body{margin:0;background:#F2EEE5}\n  a{color:#A8842C;text-decoration:none}\n  a:hover{color:#8A6B1F}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<sc-if value=\"{{ coverSichtbar }}\" hint-placeholder-val=\"{{ true }}\">\n<div sc-camel-on-click=\"{{ oeffnen }}\" style=\"position:fixed;inset:0;z-index:50;background:#FAF7F0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 32px;font-family:'Source Sans 3',sans-serif;cursor:pointer\">\n  <div style=\"width:1px;height:48px;background:#D8D0BF\"><\u002Fdiv>\n  <div style=\"margin-top:36px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#6B665E\">In liebevoller Erinnerung an<\u002Fdiv>\n  <div style=\"margin-top:22px;font-family:'Cormorant Garamond',serif;font-size:46px;line-height:1.08;color:#262428\">Klaus Hochstrate<\u002Fdiv>\n  <div style=\"margin-top:20px;font-size:15px;letter-spacing:.06em;color:#4A4741\">* 02. 03. 1967 &nbsp;&nbsp; † 17. 07. 2026<\u002Fdiv>\n  <div style=\"margin-top:40px;width:56px;height:1px;background:#D8D0BF\"><\u002Fdiv>\n  <div style=\"margin-top:32px;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:#A8842C;line-height:1.9\">You’ll never<br>walk alone<\u002Fdiv>\n  <div style=\"margin-top:56px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 30px;border:1px solid #C8B98A;color:#7A6222;font-size:14px;letter-spacing:.14em;text-transform:uppercase\">Karte öffnen<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"min-height:100vh;background:#F2EEE5;display:flex;justify-content:center;padding:32px 16px 64px;font-family:'Source Sans 3',sans-serif;box-sizing:border-box\">\n<article style=\"width:100%;max-width:600px;background:#FAF7F0;color:#262428;box-shadow:0 2px 40px rgba(60,50,30,.10);padding:72px 48px 64px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center\">\n\n  <div style=\"width:1px;height:56px;background:#D8D0BF\"><\u002Fdiv>\n  <div style=\"margin-top:44px;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#6B665E\">In liebevoller Erinnerung an<\u002Fdiv>\n  <h1 style=\"margin:26px 0 0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:56px;line-height:1.05;color:#262428\">Klaus Hochstrate<\u002Fh1>\n  <div style=\"margin-top:24px;display:flex;gap:28px;flex-wrap:wrap;justify-content:center;font-size:16px;letter-spacing:.06em;color:#4A4741\">\n    <span>* 02. 03. 1967<\u002Fspan>\n    <span>† 17. 07. 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:56px;width:64px;height:1px;background:#D8D0BF\"><\u002Fdiv>\n  <div style=\"margin-top:36px;font-size:17px;letter-spacing:.3em;text-transform:uppercase;color:#A8842C;line-height:1.8\">You’ll never<br>walk alone<\u002Fdiv>\n  <div style=\"margin-top:24px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:#5C5850\">In unseren Herzen gehst du immer mit uns.<\u002Fdiv>\n\n  <div style=\"margin-top:64px;width:100%;height:1px;background:#E6DFCF\"><\u002Fdiv>\n\n  <p style=\"margin:56px 0 0;font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.45;color:#3A3833;max-width:420px\">Plötzlich und unerwartet müssen wir Abschied nehmen von Klaus Hochstrate.<\u002Fp>\n\n  <div style=\"margin-top:52px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#A8842C\">Trauerfeier<\u002Fdiv>\n  <p style=\"margin:18px 0 0;font-size:17px;line-height:1.7;color:#5C5850;max-width:440px\">Die Trauerfeier mit anschließender Urnenbeisetzung findet statt am<\u002Fp>\n  <div style=\"margin-top:22px;font-family:'Cormorant Garamond',serif;font-size:32px;line-height:1.35;color:#262428\">Donnerstag, 13. August 2026<br>13.00 Uhr<\u002Fdiv>\n  <div style=\"margin-top:20px;font-size:18px;line-height:1.65;color:#3A3833\">Friedhofskapelle auf dem Feldmarkfriedhof<br>Brunnenallee / Kapellenweg<br>32257 Bünde<\u002Fdiv>\n\n  <div style=\"margin-top:56px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#A8842C\">Im Anschluss<\u002Fdiv>\n  <p style=\"margin:18px 0 0;font-size:17px;line-height:1.75;color:#5C5850;max-width:440px\">Im Anschluss an die Beisetzung laden wir herzlich zu einem gemeinsamen Beisammensein im Café am Feld ein. Bei kühlen Getränken, Kaffee und Kuchen möchten wir Erinnerungen teilen und gemeinsam Abschied nehmen.<\u002Fp>\n  <div style=\"margin-top:20px;font-size:18px;line-height:1.65;color:#3A3833\">Café am Feld<br>[Adresse]<br>[Uhrzeit]<\u002Fdiv>\n\n  <div style=\"margin-top:64px;width:100%;height:1px;background:#E6DFCF\"><\u002Fdiv>\n\n  <div style=\"margin-top:56px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#A8842C\">Im Gedenken an Klaus<\u002Fdiv>\n  <p style=\"margin:20px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;line-height:1.45;color:#3A3833;max-width:440px\">Klaus lag es am Herzen, Menschen in schwierigen Lebenssituationen zu helfen.<\u002Fp>\n  <p style=\"margin:20px 0 0;font-size:17px;line-height:1.75;color:#5C5850;max-width:460px\">Anstelle von Blumen und Kränzen bitten wir daher in seinem Sinne um eine Spende für die ZWILLING Foundation India. Die Stiftung unterstützt benachteiligte Kinder, Frauen und Familien in Indien und eröffnet ihnen neue Zukunftschancen. Den Blumenschmuck für die Trauerfeier übernimmt die Familie.<\u002Fp>\n\n  <div style=\"margin-top:36px;width:100%;max-width:460px;box-sizing:border-box;border:1px solid #E6DFCF;background:#F6F2E8;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n    <div style=\"font-size:17px;line-height:1.5;color:#3A3833\"><strong style=\"font-weight:700\">Werhahn Stiftung<\u002Fstrong><br>Bankhaus Werhahn GmbH<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px;font-family:ui-monospace,monospace;font-size:15px;letter-spacing:.02em;color:#262428\">\n      <div>DE95 3053 0000 0150 0100 07<\u002Fdiv>\n      <div style=\"color:#5C5850\">BIC WERHDED1XXX<\u002Fdiv>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ ibanKopieren }}\" style=\"appearance:none;border:1px solid #C8B98A;background:#FAF7F0;color:#7A6222;font-family:'Source Sans 3',sans-serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding:12px 24px;min-height:44px;cursor:pointer\" style-hover=\"background:#F1E9D6\">{{ kopierLabel }}<\u002Fbutton>\n    <div style=\"font-size:15px;line-height:1.6;color:#5C5850;max-width:340px\">Verwendungszweck:<br>Im Gedenken an Klaus Hochstrate – ZWILLING Foundation India<\u002Fdiv>\n  <\u002Fdiv>\n\n  <a href=\"https://www.werhahn-stiftung.de/einzelprojekte/zwilling-india-foundation/\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:24px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 32px;background:#A8842C;color:#FAF7F0;font-size:15px;letter-spacing:.14em;text-transform:uppercase\" style-hover=\"background:#8A6B1F;color:#FAF7F0\">Zur Spendenseite<\u002Fa>\n  <a href=\"https://zwillingfoundationindia.com/\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:16px;font-size:15px;letter-spacing:.04em;border-bottom:1px solid #DCCFA8;padding-bottom:2px\">Mehr über die ZWILLING Foundation India<\u002Fa>\n\n  <img src=\"9578cca7-5951-41b0-b1bb-0b64e4c9309d\" alt=\"QR-Code für Spenden an die ZWILLING Foundation India\" style=\"margin-top:40px;width:150px;height:150px;display:block;image-rendering:pixelated\">\n  <div style=\"margin-top:14px;font-size:15px;color:#5C5850\">Spenden im Gedenken an Klaus Hochstrate<\u002Fdiv>\n\n  <div style=\"margin-top:64px;width:100%;height:1px;background:#E6DFCF\"><\u002Fdiv>\n\n  <div style=\"margin-top:56px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:#3A3833\">In Liebe und Dankbarkeit<\u002Fdiv>\n  <div style=\"margin-top:26px;display:grid;gap:10px;font-size:18px;line-height:1.5;color:#262428\">\n    <div>Elena Hochstrate<\u002Fdiv>\n    <div>Familie Schimmelpfennig<\u002Fdiv>\n    <div>Silke Grottendiek<\u002Fdiv>\n    <div style=\"color:#5C5850\">sowie alle Freunde<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:36px;width:64px;height:1px;background:#D8D0BF\"><\u002Fdiv>\n  <div style=\"margin-top:26px;font-size:15px;letter-spacing:.06em;color:#6B665E\">33607 Bielefeld, Teutoburger Straße 93<\u002Fdiv>\n\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:680,&quot;height&quot;:1400}}\">\nclass Component extends DCLogic {\n  state = { kopiert: false, offen: false };\n  renderVals() {\n    return {\n      coverSichtbar: !this.state.offen,\n      oeffnen: () => this.setState({ offen: true }),\n      kopierLabel: this.state.kopiert ? \"IBAN kopiert\" : \"IBAN kopieren\",\n      ibanKopieren: async () => {\n        const iban = \"DE95 3053 0000 0150 0100 07\";\n        let ok = false;\n        try { await navigator.clipboard.writeText(iban); ok = true; } catch (e) {}\n        if (!ok) {\n          try {\n            const ta = document.createElement(\"textarea\");\n            ta.value = iban;\n            ta.setAttribute(\"readonly\", \"\");\n            ta.style.cssText = \"position:fixed;top:0;left:0;opacity:0\";\n            document.body.appendChild(ta);\n            ta.select();\n            ta.setSelectionRange(0, iban.length);\n            ok = document.execCommand(\"copy\");\n            document.body.removeChild(ta);\n          } catch (e) {}\n        }\n        this.setState({ kopiert: true });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ kopiert: false }), 2500);\n      }\n    };\n  }\n  componentWillUnmount() { clearTimeout(this._t); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

      s.textContent='#kh-vzw{margin:18px 0 4px;font-family:inherit;text-align:left}'

      +'#kh-vzw .kh-r{display:flex;gap:8px;margin-bottom:8px}'
      +'#kh-vzw .kh-f{display:flex;flex-direction:column;flex:1}'
      +'#kh-vzw label{font-size:11px;color:#9a927f;margin-bottom:4px;letter-spacing:.03em}'
      +'#kh-vzw input{border:1px solid #ded6c4;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:#fff;color:#3a352b;width:100%;box-sizing:border-box}'
      +'#kh-vzw input:focus{outline:none;border-color:#A8842C;box-shadow:0 0 0 3px rgba(168,132,44,.13)}'
      +'#kh-vzw .kh-h{font-size:11px;color:#a8a08d;margin:0 0 12px 2px}'
      +'#kh-vzw .kh-o{background:#fff;border:1px dashed #d8cfb8;border-radius:10px;padding:10px 12px;font-size:13px;color:#3a352b;margin-bottom:8px;word-break:break-word;min-height:18px}'
      +'#kh-vzw .kh-b{width:100%;background:#A8842C;color:#fff;border:none;border-radius:9px;padding:10px;font-size:14px;font-family:inherit;cursor:pointer}'
      +'#kh-vzw .kh-b:disabled{opacity:.35;cursor:not-allowed}'
      +'#kh-vzw .kh-n{font-size:10.5px;color:#a8a08d;margin:8px 0 0;text-align:center}'
      +'@media(max-width:400px){#kh-vzw .kh-r{flex-direction:column;gap:8px}}';
      (document.head||document.documentElement).appendChild(s);
    }
    function build(){
      var d=document.createElement('div');d.id=ID;
      d.innerHTML='<p class="kh-t">Der Verwendungszweck wirkt etwas sperrig, ist aber notwendig. &bdquo;K.Hochstrate&ldquo; ist das Stichwort, so dass die Spenden sp&auml;ter selektiert werden k&ouml;nnen. Die Adressen der spendenden Personen sind wichtig f&uuml;r sp&auml;tere Spendenbescheinigungen.</p>'
        +'<div class="kh-r"><div class="kh-f" style="flex:2"><label for="kh-s">Stra&szlig;e</label><input id="kh-s" type="text" autocomplete="address-line1" placeholder="Musterstra&szlig;e"></div>'
      +'<div class="kh-f" style="flex:1"><label for="kh-n">Nr.</label><input id="kh-n" type="text" placeholder="12"></div></div>'
      +'<div class="kh-r"><div class="kh-f" style="flex:1"><label for="kh-p">PLZ</label><input id="kh-p" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="12345"></div>'
      +'<div class="kh-f" style="flex:2"><label for="kh-o">Ort</label><input id="kh-o" type="text" autocomplete="address-level2" placeholder="Musterstadt"></div></div>'
      +'<p class="kh-h">Diese Angaben bleiben auf Ihrem Ger&auml;t. Nichts wird gespeichert oder versendet.</p>'
      +'<div class="kh-o" id="kh-out">K.Hochstrate,</div>'
      +'<button type="button" class="kh-b" id="kh-cp" disabled>Verwendungszweck kopieren</button>'
      +'<p class="kh-n">Diesen Text bei der &Uuml;berweisung als Verwendungszweck einf&uuml;gen.</p>';
      return d;
    }
    function wire(d){
      var s=d.querySelector('#kh-s'),n=d.querySelector('#kh-n'),p=d.querySelector('#kh-p'),o=d.querySelector('#kh-o'),out=d.querySelector('#kh-out'),b=d.querySelector('#kh-cp');
      function up(){
        var a=s.value.trim(),c=n.value.trim(),e=p.value.trim(),f=o.value.trim();
        var t='K.Hochstrate';
        if(a)t+=', '+a;
        if(c)t+=', '+c;
        if(e)t+=', '+e;
        if(f)t+=', '+f;
        out.textContent=t;
        b.disabled=!(a&&c&&e&&f);
      }
      [s,n,p,o].forEach(function(x){x.addEventListener('input',up);});
      up();
      b.addEventListener('click',function(){
        var t=out.textContent,lbl=b.textContent;
        function ok(){b.textContent='Kopiert';setTimeout(function(){b.textContent=lbl;},1600);}
        function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(x){}document.body.removeChild(ta);}
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fb();ok();});}else{fb();ok();}
      });
    }
    function findIban(){
      var all=document.querySelectorAll('div,section,p,li,td,span');
      for(var i=all.length-1;i>=0;i--){
        var el=all[i];
        if(el.closest('#'+ID))continue;
        var txt=el.textContent||'';
        if(txt.length>400)continue;
        if(!/DE\s*\d{2}[\s\d]{12,}/.test(txt))continue;
        var host=el;
        while(host.parentElement&&host.parentElement!==document.body&&host.parentElement.getBoundingClientRect().width<=host.getBoundingClientRect().width+2&&(host.parentElement.textContent||'').length<txt.length+300)host=host.parentElement;
        return host;
      }
      return null;
    }
    var tries=0;

   function oldZweck(){
     var els=document.querySelectorAll('div,p,span');
     for(var i=0;i<els.length;i++){
       var e=els[i];
       if(e.closest('#'+ID))continue;
       var x=e.textContent||'';
       if(x.length>240)continue;
       if(!/Verwendungszweck/i.test(x))continue;
       if(e.querySelector('input,button'))continue;
       return e;
     }
     return null;
   }
    function place(){
      if(document.getElementById(ID))return true;
      var t=findIban();
      if(!t)return false;
      css();
      var d=build();
      var old=oldZweck();
      if(old&&old.parentNode){old.parentNode.insertBefore(d,old);old.style.display='none';}
      else{t.parentNode.insertBefore(d,t.nextSibling);}
      wire(d);
      return true;
    }
var OLD=/DE\s*95\s*3053\s*0000\s*0150\s*0100\s*07/;
    var NEW='DE62 3053 0000 0150 0100 19';
    function fixIban(){
      var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n,list=[];
      while(n=w.nextNode()){if(OLD.test(n.nodeValue||''))list.push(n);}
      for(var i=0;i<list.length;i++){list[i].nodeValue=list[i].nodeValue.replace(OLD,NEW);}
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText&&!navigator.clipboard.__khfix){
        var ow=navigator.clipboard.writeText.bind(navigator.clipboard);
        navigator.clipboard.writeText=function(x){if(typeof x==='string'&&OLD.test(x))x=x.replace(OLD,NEW);return ow(x);};
        navigator.clipboard.__khfix=1;
      }
    }catch(e){}
    var done=0;
    function hideQR(){
      var q=document.querySelector('img[alt*="QR"],img[alt*="qr"]');
      if(!q)return;
      var cap=q.nextElementSibling;
      q.style.display='none';
      if(cap&&/Spenden im Gedenken/i.test(cap.textContent||''))cap.style.display='none';
    }
    var done=0;
    var iv=setInterval(function(){tries++;fixIban();hideQR();if(place())done++;if(done>20||tries>200)clearInterval(iv);},300);
    fixIban();
    hideQR();
    place();
  })();
</script>
